version: '3.8'

services:
  relay-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: relay-backend
    ports:
      - "8000:8000"
    environment:
      - RELAY_HOST=0.0.0.0
      - RELAY_PORT=8000
      - RELAY_QDRANT_IN_MEMORY=true
    volumes:
      - ./artifacts:/app/artifacts
      - ./.relay:/app/.relay
    restart: unless-stopped

  qdrant-vector-db:
    image: qdrant/qdrant:v1.7.4
    container_name: qdrant-vector-db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
